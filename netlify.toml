[build]
  command = "npm run build"
  functions = "api"
  publish = "dist"

[dev]
  targetPort = 8080

[env.production]
  SENDGRID_API_KEY = "@sendgrid_api_key"
  ADMIN_EMAIL = "@admin_email"
  SENDGRID_FROM_EMAIL = "@sendgrid_from_email"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: client-side routes (refresh / deep links) — must be after /api/*
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
